name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile_app/**'
      - 'admin_web/**'
      - 'packages/**'
      - '.github/workflows/flutter-ci.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'mobile_app/**'
      - 'admin_web/**'
      - 'packages/**'
      - '.github/workflows/flutter-ci.yml'
      - '.github/scripts/**'

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  flutter:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/lavadero_core
          - mobile_app
          - admin_web
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --fatal-infos

      - name: flutter test
        run: flutter test --coverage

      - name: Cobertura en el resumen del run
        if: always() && hashFiles(format('{0}/coverage/lcov.info', matrix.package)) != ''
        run: python3 ${{ github.workspace }}/.github/scripts/coverage_summary.py lcov coverage/lcov.info ${{ matrix.package }}

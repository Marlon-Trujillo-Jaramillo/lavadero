version: 2
# Weekly dependency updates, grouped so each ecosystem opens at most one PR.
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]
    # Major versions of libraries are planned on purpose (breaking changes), not merged weekly.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pub
    directories:
      - /packages/lavadero_core
      - /mobile_app
      - /admin_web
    schedule:
      interval: weekly
    groups:
      flutter:
        patterns: ["*"]
    # Major versions of libraries are planned on purpose (breaking changes), not merged weekly.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

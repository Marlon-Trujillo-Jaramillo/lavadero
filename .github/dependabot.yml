version: 2
# Weekly dependency updates, grouped so each ecosystem opens at most one PR.
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: pub
    directories:
      - /packages/lavadero_core
      - /mobile_app
      - /admin_web
    schedule:
      interval: weekly
    groups:
      flutter:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

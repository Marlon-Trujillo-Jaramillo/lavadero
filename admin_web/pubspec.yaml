name: admin_web
description: >
  Lavadero SaaS - Admin Web (Flutter Web): dueño de lavadero (dashboard,
  empleados, catálogo/precios, inventario, sucursales, CRM, reportes,
  promociones) y super-admin (onboarding de tenants). Solo target web.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Mismo patrón de DI+estado que mobile_app (ver justificación en
  # lib/app/di/providers.dart): Riverpod.
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0

  lavadero_core:
    path: ../packages/lavadero_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

# Despliegue de demo del backend de Lavadero en Render (capa gratis).
# Infra como código: Render -> New -> Blueprint -> conecta este repo.
# Los valores secretos (URL de la base, usuario/clave admin, secreto JWT) se
# marcan `sync: false` y se escriben en el panel de Render, NO en este archivo.
#
# Flyway corre como el admin de la base (crea el rol `lavadero_app` en V3);
# la app en runtime se conecta como `lavadero_app`, sujeto a Row-Level Security.
# Sin Kafka: el transporte de eventos es en proceso (local).
services:
  - type: web
    name: lavadero-demo-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/docker/backend.Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70"
      - key: LAVADERO_MENSAJERIA_TRANSPORTE
        value: local
      - key: SPRING_DATASOURCE_USERNAME
        value: lavadero_app
      - key: SPRING_DATASOURCE_PASSWORD
        value: lavadero_app
      - key: LAVADERO_CORS_ALLOWED_ORIGINS
        value: https://marlon-trujillo-jaramillo.github.io
      # Secretos: se escriben en el panel de Render (Environment), no en el repo.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_FLYWAY_URL
        sync: false
      - key: SPRING_FLYWAY_USER
        sync: false
      - key: SPRING_FLYWAY_PASSWORD
        sync: false
      - key: LAVADERO_SECURITY_JWT_SECRET
        sync: false

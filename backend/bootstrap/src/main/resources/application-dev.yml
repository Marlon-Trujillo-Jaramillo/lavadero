spring:
  datasource:
    # Rol de aplicación NO-superusuario (ver V3__app_role.sql): las queries
    # de negocio deben pasar por RLS, y Postgres bypasea RLS para
    # superusuarios sin excepción.
    url: jdbc:postgresql://localhost:5432/lavadero
    username: lavadero_app
    password: lavadero_app
  flyway:
    # Las migraciones sí necesitan el rol superusuario (CREATE TABLE, CREATE
    # ROLE, CREATE POLICY): distinto del datasource de runtime de arriba.
    url: jdbc:postgresql://localhost:5432/lavadero
    user: lavadero
    password: lavadero
  jpa:
    hibernate:
      ddl-auto: validate

lavadero:
  security:
    jwt:
      # Sin valor por defecto a propósito: el repo es público, así que un
      # secreto escrito aquí lo conocería cualquiera y podría firmar tokens.
      # Genera uno propio por máquina (256 bits, Base64) y expórtalo antes
      # de arrancar: ver docs/desarrollo-local.md, sección 3.
      #   export LAVADERO_SECURITY_JWT_SECRET="$(openssl rand -base64 32)"
      # Si falta, el arranque falla en vez de correr con un secreto conocido.
      secret: ${LAVADERO_SECURITY_JWT_SECRET}
    cors:
      # `flutter run -d chrome` asigna un puerto local variable en cada
      # corrida (no hay un puerto fijo de `admin_web` en dev): se permite
      # cualquier puerto en localhost/127.0.0.1 en vez de listar orígenes
      # exactos. Solo para desarrollo local, nunca para producción.
      allowed-origin-patterns:
        - "http://localhost:*"
        - "http://127.0.0.1:*"

logging:
  level:
    com.lavadero: DEBUG

spring:
  application:
    name: lavadero-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    # Barre `db/migration` en TODOS los jars del classpath: cubre tanto
    # V1__tenant_management.sql (módulo tenant-management) como
    # V2__identity_access.sql (módulo identity-access).
    locations: classpath:db/migration

server:
  port: 8080
  # Detrás de un proxy/load balancer: Tomcat (RemoteIpValve) toma la IP real de
  # X-Forwarded-For SOLO si la conexión viene de una red interna. RateLimitFilter
  # depende de esto para no confiar en un header que cualquier cliente puede falsear.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

# Monitoreo de errores (ver docs/specs/004-observabilidad.md). `dsn` vacío
# (valor por defecto sin la variable de entorno) = SDK en modo no-op, no
# rompe arranque/tests. NUNCA hardcodear un DSN real aquí: viene de
# SENTRY_DSN, igual patrón que LAVADERO_SECURITY_JWT_SECRET.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${spring.profiles.active:default}
  # Sampling bajo: trazas de performance mínimas, sin costo/ruido alto para
  # el volumen de tráfico esperado en esta fase (ver ADR 0001).
  traces-sample-rate: 0.1

lavadero:
  security:
    jwt:
      issuer: lavadero
      access-token-ttl: 15m
      # `secret` se define por perfil (ver application-dev.yml). NUNCA
      # hardcodear un secreto de producción aquí ni versionarlo: en
      # producción debe venir de una variable de entorno
      # (LAVADERO_SECURITY_JWT_SECRET) respaldada por un secret manager.
    cors:
      # Vacío por defecto = ningún origen cross-origin permitido. En
      # producción, listar el/los orígenes exactos de `admin_web` desplegado
      # vía LAVADERO_CORS_ALLOWED_ORIGINS (coma-separado), p. ej.
      # "https://admin.lavadero.com". Ver application-dev.yml para el
      # equivalente de desarrollo local.
      allowed-origins: ${LAVADERO_CORS_ALLOWED_ORIGINS:}
      allowed-origin-patterns: ${LAVADERO_CORS_ALLOWED_ORIGIN_PATTERNS:}
  payments:
    wompi:
      # Cobro de suscripciones (ver PagoController, tenant-management). Todo vacío por
      # defecto = pagos deshabilitados y webhook rechazado (falla cerrado), mismo patrón que
      # SENTRY_DSN. Los tres secretos están en el dashboard de Wompi ("Desarrolladores"):
      # la llave pública (pub_test_/pub_prod_) viaja al cliente; el secreto de integridad
      # firma el checkout y el de eventos verifica los webhooks — NUNCA versionarlos.
      public-key: ${WOMPI_PUBLIC_KEY:}
      integrity-secret: ${WOMPI_INTEGRITY_SECRET:}
      events-secret: ${WOMPI_EVENTS_SECRET:}
      checkout-url: ${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/p/}
      # A dónde vuelve el usuario tras pagar (pantalla de admin_web). Solo informativo:
      # el estado real del pago lo fija el webhook POST /api/v1/pagos/webhook/wompi.
      redirect-url: ${WOMPI_REDIRECT_URL:}
